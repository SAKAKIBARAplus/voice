<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>void Aquarium(stack-chan);</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(to bottom, #001219 0%, #003049 100%);
    color: white;
}

/* 水槽背景 */
.aquarium {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* 泡 */
.bubble {
    position: absolute;
    bottom: -100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    animation: rise linear infinite;
}

@keyframes rise {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-120vh);
    }
}

/* UI */
.ui {
    position: relative;
    z-index: 10;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;

    padding: 30px;
    box-sizing: border-box;
}

/* チャット欄 */
.chatbox {
    width: min(700px, 90%);
    height: 55vh;

    overflow-y: auto;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;

    padding: 20px;
    box-sizing: border-box;

    margin-bottom: 20px;
}

/* メッセージ */
.message {
    margin: 12px 0;
    padding: 12px 16px;
    border-radius: 18px;
    max-width: 80%;
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
}

.user {
    margin-left: auto;
    background: rgba(120,220,255,0.25);
}

.system {
    background: rgba(255,255,255,0.12);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* 入力欄 */
.controls {
    width: min(700px, 90%);
    display: flex;
    gap: 12px;
}

input {
    flex: 1;
    border: none;
    outline: none;

    padding: 16px;
    border-radius: 18px;

    font-size: 16px;

    background: rgba(255,255,255,0.12);
    color: white;
}

input::placeholder {
    color: rgba(255,255,255,0.5);
}

button {
    border: none;
    border-radius: 18px;

    padding: 16px 22px;

    font-size: 16px;
    cursor: pointer;

    background: rgba(120,220,255,0.25);
    color: white;

    transition: 0.2s;
}

button:hover {
    background: rgba(120,220,255,0.4);
}

/* タイトル */
.title {
    position: absolute;
    top: 20px;
    left: 20px;

    font-size: 28px;
    font-weight: bold;

    color: rgba(255,255,255,0.9);

    z-index: 20;
}
</style>
</head>

<body>

<div class="aquarium" id="aquarium"></div>

<div class="title">
void Aquarium(stack-chan);
</div>

<div class="ui">

    <div class="chatbox" id="chatbox">
        <div class="message system">
            接続待機中...
        </div>
    </div>

    <div class="controls">
        <input type="text" id="textInput" placeholder="話しかける..." />
        <button onclick="sendText()">送信</button>
        <button onclick="startRecognition()">🎤</button>
    </div>

</div>

<script>

// =======================
// CoreS3 URL
// =======================

const CHAT_URL = "http://stack-chan.local/chat";

// =======================
// 泡生成
// =======================

const aquarium = document.getElementById("aquarium");

for(let i = 0; i < 35; i++) {

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    const size = Math.random() * 18 + 6;

    bubble.style.width = size + "px";
    bubble.style.height = size + "px";

    bubble.style.left = Math.random() * 100 + "%";

    bubble.style.animationDuration = (Math.random() * 10 + 8) + "s";
    bubble.style.animationDelay = Math.random() * 10 + "s";

    aquarium.appendChild(bubble);
}

// =======================
// チャット表示
// =======================

function addMessage(type, text) {

    const chatbox = document.getElementById("chatbox");

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chatbox.appendChild(div);

    chatbox.scrollTop = chatbox.scrollHeight;
}

// =======================
// 送信
// =======================

function sendText() {

    const input = document.getElementById("textInput");

    const text = input.value.trim();

    if(text === "") return;

    addMessage("user", text);

    input.value = "";

    // レスポンス無し送信
    fetch(CHAT_URL + "?text=" + encodeURIComponent(text), {
        mode: "no-cors"
    }).catch(err => {
        console.error(err);
        addMessage("system", "通信エラー");
    });
}

// =======================
// Enter送信
// =======================

document.getElementById("textInput").addEventListener("keydown", e => {

    if(e.key === "Enter") {
        sendText();
    }
});

// =======================
// 音声認識
// =======================

function startRecognition() {

    if (!('webkitSpeechRecognition' in window)) {

        alert("このブラウザは音声認識に対応していません");
        return;
    }

    const recognition = new webkitSpeechRecognition();

    recognition.lang = 'ja-JP';

    recognition.start();

    recognition.onstart = function() {

        addMessage("system", "聞き取り中...");
    };

    recognition.onresult = function(event) {

        const text = event.results[0][0].transcript;

        document.getElementById("textInput").value = text;

        sendText();
    };

    recognition.onerror = function(event) {

        addMessage("system", "音声認識エラー: " + event.error);
    };
}

</script>

</body>
</html>
