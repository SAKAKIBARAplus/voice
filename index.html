<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>void Aquarium(stack-chan);</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:"Segoe UI",sans-serif;
    background:linear-gradient(to bottom,#001219 0%,#003049 100%);
    color:white;
}

/* 水槽背景 */

.aquarium{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* 泡 */

.bubble{
    position:absolute;
    bottom:-100px;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    animation:rise linear infinite;
}

@keyframes rise{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

/* タイトル */

.title{
    position:absolute;
    top:20px;
    left:20px;

    z-index:20;

    font-size:28px;
    font-weight:bold;

    color:rgba(255,255,255,0.9);
}

/* UI */

.ui{
    position:relative;
    z-index:10;

    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;

    padding:30px;
    box-sizing:border-box;
}

/* チャット欄 */

.chatbox{

    width:min(720px,92%);
    height:58vh;

    overflow-y:auto;

    padding:20px;
    box-sizing:border-box;

    border-radius:28px;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(10px);

    margin-bottom:18px;
}

/* メッセージ */

.message{

    max-width:80%;

    margin:12px 0;
    padding:14px 18px;

    border-radius:20px;

    line-height:1.6;

    animation:fadeIn 0.25s ease;
}

.user{
    margin-left:auto;
    background:rgba(120,220,255,0.28);
}

.bot{
    background:rgba(255,255,255,0.14);
}

.system{
    background:rgba(255,180,180,0.15);
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* 入力欄 */

.controls{

    width:min(720px,92%);

    display:flex;
    gap:12px;
}

input{

    flex:1;

    border:none;
    outline:none;

    padding:16px;

    border-radius:18px;

    font-size:16px;

    background:rgba(255,255,255,0.12);

    color:white;
}

input::placeholder{
    color:rgba(255,255,255,0.45);
}

button{

    border:none;
    cursor:pointer;

    border-radius:18px;

    padding:16px 22px;

    font-size:16px;

    background:rgba(120,220,255,0.25);

    color:white;

    transition:0.2s;
}

button:hover{
    background:rgba(120,220,255,0.42);
}

</style>
</head>

<body>

<div class="aquarium" id="aquarium"></div>

<div class="title">
void Aquarium(stack-chan);
</div>

<div class="ui">

    <div class="chatbox" id="chatbox">

        <div class="message bot">
            ……。
        </div>

    </div>

    <div class="controls">

        <input
            type="text"
            id="textInput"
            placeholder="話しかける..."
        >

        <button onclick="sendText()">
            送信
        </button>

        <button onclick="startRecognition()">
            🎤
        </button>

    </div>

</div>

<script>

// ======================
// CoreS3 URL
// ======================

const CHAT_URL = "http://stack-chan.local/chat";

// ======================
// 泡生成
// ======================

const aquarium = document.getElementById("aquarium");

for(let i=0;i<40;i++){

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    const size = Math.random()*18+6;

    bubble.style.width = size + "px";
    bubble.style.height = size + "px";

    bubble.style.left = Math.random()*100 + "%";

    bubble.style.animationDuration =
        (Math.random()*10+8)+"s";

    bubble.style.animationDelay =
        Math.random()*10+"s";

    aquarium.appendChild(bubble);
}

// ======================
// メッセージ追加
// ======================

function addMessage(type,text){

    const chatbox =
        document.getElementById("chatbox");

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chatbox.appendChild(div);

    chatbox.scrollTop = chatbox.scrollHeight;

    return div;
}

// ======================
// 送信
// ======================

async function sendText(){

    const input =
        document.getElementById("textInput");

    const text = input.value.trim();

    if(text === "") return;

    addMessage("user", text);

    input.value = "";

    // thinking表示
    const thinking =
        addMessage("bot", "……");

    try{

        const response = await fetch(

            CHAT_URL +
            "?text=" +
            encodeURIComponent(text),

            {
                method:"GET"
            }
        );

        const data = await response.text();

        thinking.textContent = data;

    }catch(err){

        console.error(err);

        thinking.className = "message system";

        thinking.textContent =
            "通信エラー";
    }
}

// ======================
// Enter送信
// ======================

document
.getElementById("textInput")
.addEventListener("keydown", e=>{

    if(e.key==="Enter"){
        sendText();
    }
});

// ======================
// 音声認識
// ======================

function startRecognition(){

    if(!('webkitSpeechRecognition' in window)){

        alert("このブラウザは音声認識に対応していません");

        return;
    }

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "ja-JP";

    recognition.start();

    recognition.onstart = function(){

        addMessage("system","聞き取り中...");
    };

    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        document.getElementById("textInput").value =
            text;

        sendText();
    };

    recognition.onerror = function(event){

        addMessage(
            "system",
            "音声認識エラー: " + event.error
        );
    };
}

</script>

</body>
</html>
