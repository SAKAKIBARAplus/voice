<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>void Aquarium(stack-chan);</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:"Segoe UI",sans-serif;
    background:linear-gradient(to bottom,#02111B 0%,#062B43 100%);
    color:white;
}

/* =========================
   背景
========================= */

.aquarium{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* 泡 */

.bubble{
    position:absolute;
    bottom:-100px;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    animation:rise linear infinite;
}

@keyframes rise{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

/* =========================
   Stack-chan表示
========================= */

.avatar-area{

    position:absolute;

    top:38%;
    left:50%;

    transform:translate(-50%,-58%);

    text-align:center;

    z-index:5;
}

.avatar-face{

    font-size:120px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(127,219,255,0.4)
        );

    animation:
        float 4s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0px);
    }
}

.avatar-name{

    margin-top:15px;

    font-size:22px;

    letter-spacing:4px;

    color:#7FDBFF;

    text-shadow:
        0 0 12px rgba(127,219,255,0.25);
}

/* =========================
   タイトル
========================= */

.title{
    position:absolute;
    top:18px;
    left:20px;

    z-index:20;

    font-size:28px;
    font-weight:bold;

    color:rgba(255,255,255,0.92);

    text-shadow:0 0 10px rgba(255,255,255,0.2);
}

.subtitle{
    font-size:13px;
    opacity:0.7;
    margin-top:4px;
}

/* =========================
   ステータス
========================= */

.status-panel{

    position:absolute;
    top:20px;
    right:20px;

    z-index:20;

    width:220px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(12px);

    border-radius:20px;

    padding:16px;
}

.status-title{

    font-size:14px;
    opacity:0.7;

    margin-bottom:10px;
}

.status-item{

    display:flex;
    justify-content:space-between;

    margin:8px 0;

    font-size:15px;
}

.status-label{
    opacity:0.7;
}

/* =========================
   メインUI
========================= */

.ui{

    position:relative;
    z-index:10;

    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;

    padding:28px;
}

/* =========================
   観察ログ
========================= */

.log-title{

    width:min(760px,94%);
    margin-bottom:10px;

    font-size:18px;
    letter-spacing:1px;

    opacity:0.8;
}

.chatbox{

    width:min(760px,94%);
    height:40vh;

    overflow-y:auto;

    border-radius:28px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(12px);

    padding:20px;

    margin-bottom:18px;
}

/* スクロールバー */

.chatbox::-webkit-scrollbar{
    width:6px;
}

.chatbox::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.2);
    border-radius:10px;
}

/* メッセージ */

.message{

    margin:14px 0;
    padding:14px 18px;

    border-radius:20px;

    line-height:1.7;

    animation:fadeIn 0.25s ease;

    max-width:85%;
}

.user{

    margin-left:auto;

    background:rgba(120,220,255,0.24);
}

.bot{

    background:rgba(255,255,255,0.12);
}

.system{

    background:rgba(255,180,180,0.12);
}

.message-time{

    font-size:11px;
    opacity:0.55;

    margin-top:6px;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   入力欄
========================= */

.controls{

    width:min(760px,94%);

    display:flex;
    gap:12px;
}

input{

    flex:1;

    border:none;
    outline:none;

    border-radius:18px;

    padding:16px;

    font-size:16px;

    background:rgba(255,255,255,0.12);

    color:white;
}

input::placeholder{

    color:rgba(255,255,255,0.45);
}

button{

    border:none;

    cursor:pointer;

    border-radius:18px;

    padding:16px 22px;

    font-size:16px;

    background:rgba(120,220,255,0.25);

    color:white;

    transition:0.2s;
}

button:hover{

    background:rgba(120,220,255,0.42);
}

/* =========================
   モバイル
========================= */

@media(max-width:700px){

    .avatar-area{
        top:34%;
    }
    .status-panel{

        width:180px;
        font-size:13px;

        top:80px;
        right:12px;
    }

    .title{
        font-size:22px;
    }

    .avatar-face{
        font-size:80px;
    }
}
</style>
</head>

<body>

<!-- 背景 -->
<div class="aquarium" id="aquarium"></div>

<!-- Stack-chan -->
<div class="avatar-area">

    <div class="avatar-face">
        ◉_◉
    </div>

    <div class="avatar-name">
        void Aquarium
    </div>

</div>

<!-- タイトル -->
<div class="title">
    void Aquarium(stack-chan);
    <div class="subtitle">
        Observation Log Interface
    </div>
</div>

<!-- ステータス -->
<div class="status-panel">

    <div class="status-title">
        飼育環境モニタ
    </div>

    <div class="status-item">
        <span class="status-label">水温</span>
        <span id="temp">24.6°C</span>
    </div>

    <div class="status-item">
        <span class="status-label">湿度</span>
        <span id="humid">48%</span>
    </div>

    <div class="status-item">
        <span class="status-label">好感度増減</span>
        <span id="likeability">0</span>
    </div>

    <div class="status-item">
        <span class="status-label">感情状態</span>
        <span id="emotion">警戒</span>
    </div>

</div>

<!-- UI -->
<div class="ui">

    <div class="log-title">
        観察記録
    </div>

    <div class="chatbox" id="chatbox">

        <div class="message bot">
            ……みずの、おとがする。
            <div class="message-time">00:00</div>
        </div>

    </div>

    <div class="controls">

        <input
            type="text"
            id="textInput"
            placeholder="観察対象へ話しかける..."
        >

        <button onclick="sendText()">
            記録
        </button>

        <button onclick="startRecognition()">
            🎤
        </button>

    </div>

</div>

<script>

/* =========================
   ESP32 URL
========================= */

const CHAT_URL =
    "http://stack-chan.local/chat";

let currentLikeability = 0;
/* =========================
   泡生成
========================= */

const aquarium =
    document.getElementById("aquarium");

for(let i=0;i<45;i++){

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    const size =
        Math.random()*18+6;

    bubble.style.width =
        size+"px";

    bubble.style.height =
        size+"px";

    bubble.style.left =
        Math.random()*100+"%";

    bubble.style.animationDuration =
        (Math.random()*10+8)+"s";

    bubble.style.animationDelay =
        Math.random()*10+"s";

    aquarium.appendChild(bubble);
}

/* =========================
   時刻取得
========================= */

function getTime(){

    const now = new Date();

    return now.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

/* =========================
   メッセージ追加
========================= */

function addMessage(type,text){

    const chatbox =
        document.getElementById("chatbox");

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.innerHTML =
        `
        ${text}
        <div class="message-time">
            ${getTime()}
        </div>
        `;

    chatbox.appendChild(div);

    chatbox.scrollTop =
        chatbox.scrollHeight;

    return div;
}

/* =========================
   送信
========================= */

async function sendText(){

    const input =
        document.getElementById("textInput");

    const text =
        input.value.trim();

    if(text === "") return;

    addMessage("user", text);

    input.value = "";

    const thinking =
        addMessage("bot", "……");

    try{

        const response =
            await fetch(

                CHAT_URL +
                "?text=" +
                encodeURIComponent(text),

                {
                    method:"GET"
                }
            );

const data =
    await response.text();

/* =========================
   LIKEABILITY 抽出
========================= */

const match =
    data.match(
        /\[LIKEABILITY:([+-]?\d+)\]/
    );

/* =========================
   EVOLUTION 抽出
========================= */

const evolutionMatch =
    data.match(
        /\[EVOLUTION:(\d+)\]/
    );

if(evolutionMatch){

    const evolution =
        parseInt(evolutionMatch[1]);

    let emotionText = "不明";

    switch(evolution){

        case 1:
            emotionText = "警戒";
            break;

        case 2:
            emotionText = "不安";
            break;

        case 3:
            emotionText = "興味";
            break;

        case 4:
            emotionText = "安心";
            break;

        case 5:
            emotionText = "好奇心";
            break;
    }

    document
        .getElementById("emotion")
        .textContent =
        emotionText;
}

let cleanText = data;

if(match){

    const value =
        parseInt(match[1]);

    currentLikeability += value;

    document
        .getElementById("likeability")
        .textContent =
        value;

    /* 表示文字から削除 */

 cleanText =
    data
    .replace(
        /\[LIKEABILITY:[^\]]+\]/g,
        ""
    )
    .replace(
        /\[EVOLUTION:[^\]]+\]/g,
        ""
    )
    .trim();
}

/* =========================
   表示
========================= */

thinking.innerHTML =
    `
    ${cleanText}
    <div class="message-time">
        ${getTime()}
    </div>
    `;

    }catch(err){

        console.error(err);

        thinking.className =
            "message system";

        thinking.innerHTML =
            `
            通信エラー
            <div class="message-time">
                ${getTime()}
            </div>
            `;
    }
}

/* =========================
   Enter送信
========================= */

document
.getElementById("textInput")
.addEventListener("keydown", e=>{

    if(e.key==="Enter"){
        sendText();
    }
});

/* =========================
   音声認識
========================= */

function startRecognition(){

    if(!('webkitSpeechRecognition'
        in window)){

        alert(
            "このブラウザは音声認識に対応していません"
        );

        return;
    }

    const recognition =
        new webkitSpeechRecognition();

    recognition.lang = "ja-JP";

    recognition.start();

    recognition.onstart = function(){

        addMessage(
            "system",
            "音声採集中..."
        );
    };

    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        document
        .getElementById("textInput")
        .value = text;

        sendText();
    };

    recognition.onerror = function(event){

        addMessage(
            "system",
            "音声認識エラー: " +
            event.error
        );
    };
}

/* =========================
   ダミー環境変動
========================= */

setInterval(()=>{

    const temp =
        (24 + Math.random()*2).toFixed(1);

    const humid =
        Math.floor(45 + Math.random()*10);

    document.getElementById("temp")
        .textContent =
        temp + "°C";

    document.getElementById("humid")
        .textContent =
        humid + "%";

},4000);

</script>

</body>
</html>
