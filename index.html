<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>void Aquarium(stack-chan);</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    overflow:hidden;

    font-family:
    "Yu Gothic",
    "Hiragino Sans",
    sans-serif;

    background:
    linear-gradient(
        to bottom,
        #02141f 0%,
        #062c43 50%,
        #0d4f73 100%
    );

    color:#eef7ff;
}

/* =========================
   水槽背景
========================= */

.aquarium{

    position:fixed;
    inset:0;
    overflow:hidden;
}

/* 光 */

.light{

    position:absolute;

    width:120vw;
    height:120vw;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,0.12),
        transparent 70%
    );

    top:-80vw;
    left:-10vw;

    animation:
    waterLight 8s ease-in-out infinite;
}

@keyframes waterLight{

    0%{
        transform:translateX(0px);
    }

    50%{
        transform:translateX(40px);
    }

    100%{
        transform:translateX(0px);
    }
}

/* 泡 */

.bubble{

    position:absolute;

    bottom:-100px;

    border-radius:50%;

    background:
    rgba(255,255,255,0.18);

    animation:
    rise linear infinite;
}

@keyframes rise{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-120vh);
    }
}

/* =========================
   観察日記ノート
========================= */

.diary{

    position:relative;

    z-index:10;

    width:min(820px,92%);
    height:92vh;

    margin:4vh auto;

    background:
    rgba(244,238,224,0.92);

    color:#2d2d2d;

    border-radius:28px;

    overflow:hidden;

    box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

    display:flex;
    flex-direction:column;
}

/* ノート上部 */

.header{

    padding:24px 28px;

    background:
    linear-gradient(
        to right,
        #f7f0dd,
        #efe5ca
    );

    border-bottom:
    2px dashed rgba(0,0,0,0.12);
}

.title{

    font-size:32px;
    font-weight:bold;

    letter-spacing:1px;
}

.subtitle{

    margin-top:6px;

    color:#666;
    font-size:14px;
}

/* ログ */

.chatbox{

    flex:1;

    overflow-y:auto;

    padding:
    24px 24px 120px 24px;

    background:

    repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        rgba(0,0,0,0.05) 32px
    );
}

/* メッセージ */

.message{

    margin-bottom:24px;

    animation:
    fadeIn 0.3s ease;
}

.label{

    font-size:13px;
    color:#777;

    margin-bottom:4px;
}

.content{

    display:inline-block;

    max-width:85%;

    padding:
    10px 14px;

    border-radius:14px;

    line-height:1.8;

    white-space:pre-wrap;
}

/* ユーザー */

.user .content{

    background:#d8ecff;

    border-left:
    5px solid #5ba8ff;
}

/* bot */

.bot .content{

    background:#fff7d6;

    border-left:
    5px solid #f2c94c;
}

/* system */

.system .content{

    background:#ffe4e4;

    border-left:
    5px solid #ff7676;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   入力欄
========================= */

.controls{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:18px;

    background:
    rgba(255,255,255,0.82);

    border-top:
    1px solid rgba(0,0,0,0.08);

    display:flex;
    gap:12px;
}

input{

    flex:1;

    border:none;
    outline:none;

    border-radius:14px;

    padding:14px;

    font-size:16px;

    background:#f5f5f5;
}

button{

    border:none;

    border-radius:14px;

    padding:
    14px 18px;

    cursor:pointer;

    font-size:15px;

    background:#4b93c9;

    color:white;

    transition:0.2s;
}

button:hover{

    transform:translateY(-2px);

    background:#5aa5de;
}

/* =========================
   スマホ
========================= */

@media(max-width:700px){

    .title{
        font-size:24px;
    }

    .diary{
        width:100%;
        height:100vh;
        margin:0;
        border-radius:0;
    }
}

</style>
</head>

<body>

<div class="aquarium" id="aquarium">

    <div class="light"></div>

</div>

<div class="diary">

    <div class="header">

        <div class="title">
            void Aquarium(stack-chan);
        </div>

        <div class="subtitle">
            観察記録ログ
        </div>

    </div>

    <div class="chatbox" id="chatbox">

        <div class="message bot">

            <div class="label">
                aquarium log
            </div>

            <div class="content">
                ……こちらを見ている。
            </div>

        </div>

    </div>

    <div class="controls">

        <input
            type="text"
            id="textInput"
            placeholder="観察記録を入力..."
        >

        <button onclick="sendText()">
            記録
        </button>

        <button onclick="startRecognition()">
            🎤
        </button>

    </div>

</div>

<script>

// ======================
// CoreS3 URL
// ======================

const CHAT_URL =
"http://stack-chan.local/chat";

// ======================
// 泡
// ======================

const aquarium =
document.getElementById("aquarium");

for(let i=0;i<35;i++){

    const bubble =
    document.createElement("div");

    bubble.className = "bubble";

    const size =
    Math.random()*16+6;

    bubble.style.width =
    size + "px";

    bubble.style.height =
    size + "px";

    bubble.style.left =
    Math.random()*100 + "%";

    bubble.style.animationDuration =
    (Math.random()*10+8)+"s";

    bubble.style.animationDelay =
    Math.random()*10+"s";

    aquarium.appendChild(bubble);
}

// ======================
// メッセージ追加
// ======================

function addMessage(type,text){

    const chatbox =
    document.getElementById("chatbox");

    const wrapper =
    document.createElement("div");

    wrapper.className =
    "message " + type;

    const label =
    document.createElement("div");

    label.className = "label";

    if(type==="user"){
        label.textContent =
        "observer";
    }
    else if(type==="bot"){
        label.textContent =
        "aquarium log";
    }
    else{
        label.textContent =
        "system";
    }

    const content =
    document.createElement("div");

    content.className =
    "content";

    content.textContent = text;

    wrapper.appendChild(label);
    wrapper.appendChild(content);

    chatbox.appendChild(wrapper);

    chatbox.scrollTop =
    chatbox.scrollHeight;

    return content;
}

// ======================
// 送信
// ======================

async function sendText(){

    const input =
    document.getElementById("textInput");

    const text =
    input.value.trim();

    if(text==="") return;

    addMessage("user", text);

    input.value = "";

    const thinking =
    addMessage("bot","……");

    try{

        const response =
        await fetch(

            CHAT_URL +
            "?text=" +
            encodeURIComponent(text),

            {
                method:"GET"
            }
        );

        const data =
        await response.text();

        thinking.textContent =
        data;

    }catch(err){

        console.error(err);

        thinking.textContent =
        "通信が途切れている。";
    }
}

// ======================
// Enter送信
// ======================

document
.getElementById("textInput")
.addEventListener(
"keydown",
e=>{

    if(e.key==="Enter"){

        sendText();
    }
});

// ======================
// 音声認識
// ======================

function startRecognition(){

    if(!(
        'webkitSpeechRecognition'
        in window
    )){
        alert(
        "音声認識に対応していません"
        );
        return;
    }

    const recognition =
    new webkitSpeechRecognition();

    recognition.lang = "ja-JP";

    recognition.start();

    recognition.onstart =
    function(){

        addMessage(
        "system",
        "水槽の音を拾っている..."
        );
    };

    recognition.onresult =
    function(event){

        const text =
        event.results[0][0]
        .transcript;

        document
        .getElementById(
        "textInput"
        ).value = text;

        sendText();
    };

    recognition.onerror =
    function(event){

        addMessage(
        "system",
        "音声認識失敗: "
        + event.error
        );
    };
}

</script>

</body>
</html>
