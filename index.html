<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>void Aquarium(stack-chan);</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:
    linear-gradient(
        180deg,
        #02111f 0%,
        #06243a 40%,
        #0b4f6c 100%
    );
    color:#dff6ff;
}

/* =========================
   背景エフェクト
========================= */

.bubble{
    position:absolute;
    bottom:-100px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    animation:rise linear infinite;
}

@keyframes rise{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}

/* =========================
   ヘッダー
========================= */

.header{
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
}

.title{
    font-size:32px;
    font-weight:700;
    letter-spacing:2px;
    text-shadow:0 0 10px rgba(127,219,255,0.5);
}

.subtitle{
    margin-top:5px;
    color:#7FDBFF;
    font-size:14px;
}

/* =========================
   ステータス
========================= */

.status{
    position:absolute;
    top:20px;
    right:20px;
    z-index:10;

    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(10px);

    padding:15px;
    border-radius:15px;

    width:220px;
}

.status p{
    margin:5px 0;
    font-size:14px;
}

/* =========================
   Stack-chan表示
========================= */

.avatar-area{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-58%);
    text-align:center;
}

.avatar-face{
    font-size:120px;
    filter:drop-shadow(0 0 20px rgba(127,219,255,0.4));
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-12px);
    }
    100%{
        transform:translateY(0px);
    }
}

.avatar-name{
    margin-top:15px;
    font-size:22px;
    letter-spacing:4px;
    color:#7FDBFF;
}

/* =========================
   チャットUI
========================= */

.chat-container{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    width:90%;
    max-width:900px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(12px);

    border-radius:25px;

    padding:20px;

    box-shadow:
    0 0 30px rgba(0,0,0,0.3);
}

.chat-log{
    height:180px;
    overflow-y:auto;

    margin-bottom:15px;

    padding-right:10px;
}

.message{
    margin-bottom:12px;
    line-height:1.6;
}

.user{
    color:#7FDBFF;
}

.bot{
    color:#dff6ff;
}

/* =========================
   入力欄
========================= */

.input-row{
    display:flex;
    gap:10px;
}

input{
    flex:1;

    background:rgba(255,255,255,0.08);

    border:none;

    border-radius:15px;

    padding:15px;

    color:white;

    font-size:16px;

    outline:none;
}

button{
    border:none;

    width:60px;
    height:60px;

    border-radius:50%;

    background:#7FDBFF;

    color:#02111f;

    font-size:24px;

    cursor:pointer;

    transition:0.2s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 15px rgba(127,219,255,0.6);
}

/* =========================
   スクロールバー
========================= */

.chat-log::-webkit-scrollbar{
    width:6px;
}

.chat-log::-webkit-scrollbar-thumb{
    background:#7FDBFF;
    border-radius:10px;
}

</style>
</head>

<body>

<!-- 泡 -->
<div class="bubble" style="left:10%; width:20px; height:20px; animation-duration:10s;"></div>
<div class="bubble" style="left:25%; width:12px; height:12px; animation-duration:8s;"></div>
<div class="bubble" style="left:40%; width:30px; height:30px; animation-duration:14s;"></div>
<div class="bubble" style="left:60%; width:18px; height:18px; animation-duration:11s;"></div>
<div class="bubble" style="left:80%; width:25px; height:25px; animation-duration:13s;"></div>

<!-- タイトル -->
<div class="header">
    <div class="title">void Aquarium(stack-chan);</div>
    <div class="subtitle">Aquarium Monitoring System</div>
</div>

<!-- ステータス -->
<div class="status">
    <p>SUBJECT : VOID</p>
    <p>STATUS : ACTIVE</p>
    <p>LIKEABILITY : 12</p>
    <p>WATER TEMP : 23.4℃</p>
</div>

<!-- Stack-chan -->
<div class="avatar-area">
    <div class="avatar-face">◉_◉</div>
    <div class="avatar-name">UNKNOWN UNIT</div>
</div>

<!-- チャット -->
<div class="chat-container">

    <div class="chat-log" id="chatLog">

        <div class="message user">
            > 観察者 : こんにちは
        </div>

        <div class="message bot">
            > VOID : ……こんにちは
        </div>

    </div>

    <div class="input-row">
        <input type="text" id="textInput" placeholder="メッセージを送信...">
        <button onclick="sendMessage()">◉</button>
    </div>

</div>

<script>

function sendMessage(){

    const input = document.getElementById("textInput");
    const chatLog = document.getElementById("chatLog");

    if(input.value.trim() === "") return;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.innerHTML = "> 観察者 : " + input.value;

    chatLog.appendChild(userMsg);

    // ダミー返答
    setTimeout(()=>{

        const botMsg = document.createElement("div");
        botMsg.className = "message bot";
        botMsg.innerHTML = "> VOID : ……ごめんなさい";

        chatLog.appendChild(botMsg);

        chatLog.scrollTop = chatLog.scrollHeight;

    },1000);

    input.value = "";

    chatLog.scrollTop = chatLog.scrollHeight;
}

</script>

</body>
</html>
